<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti ❤️</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #mensaje {
      position: absolute;
      bottom: 30px;
      color: white;
      font-size: 1.4rem;
      opacity: 0;
      text-align: center;
      width: 100%;
      transition: opacity 2s ease;
      z-index: 3;
    }

    canvas#letras {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }

    canvas#threeCanvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="mensaje">
    Te amo tanto mi niña,<br>
    te extraño mucho 😔,<br>
    por favor no tardes en regresar,<br>
    eres mi vida ❤️
  </div>

  <!-- Fondo de letras cayendo -->
  <canvas id="letras"></canvas>
  
  <!-- Escena 3D -->
  <canvas id="threeCanvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    /********************
     * 🎇 LETRAS E y V cayendo
     ********************/
    const letrasCanvas = document.getElementById('letras');
    const ctx = letrasCanvas.getContext('2d');
    letrasCanvas.width = window.innerWidth;
    letrasCanvas.height = window.innerHeight;

    const letras = [];
    for (let i = 0; i < 80; i++) {
      letras.push({
        x: Math.random() * letrasCanvas.width,
        y: Math.random() * letrasCanvas.height,
        letra: Math.random() < 0.5 ? 'E' : 'V',
        velocidad: 1 + Math.random() * 2,
        tamaño: 14 + Math.random() * 14
      });
    }

    function animarLetras() {
      ctx.clearRect(0, 0, letrasCanvas.width, letrasCanvas.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      letras.forEach(l => {
        ctx.font = `${l.tamaño}px Arial`;
        ctx.fillText(l.letra, l.x, l.y);
        l.y += l.velocidad;
        if (l.y > letrasCanvas.height) {
          l.y = -10;
          l.x = Math.random() * letrasCanvas.width;
        }
      });
      requestAnimationFrame(animarLetras);
    }
    animarLetras();

    /********************
     * 🫀 CORAZÓN CON PUNTOS
     ********************/
    const threeCanvas = document.getElementById('threeCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    // Luz principal rosa brillante con glow
    const light = new THREE.PointLight(0xff66cc, 2, 200);
    light.position.set(0, 0, 30);
    scene.add(light);

    // Luz ambiental rosa suave para glow extra
    const ambientLight = new THREE.AmbientLight(0xff66cc, 0.2);
    scene.add(ambientLight);

    const colores = [0xff0000, 0xff69b4, 0xffffff];
    const geometry = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];

    const totalPuntos = 800;
    for (let i = 0; i < totalPuntos; i++) {
      let t = Math.random() * Math.PI * 2;
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      x /= 8;
      y /= 8;
      positions.push(x, y, (Math.random() - 0.5) * 0.5);

      const color = new THREE.Color(colores[Math.floor(Math.random() * colores.length)]);
      colors.push(color.r, color.g, color.b);
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.2,
      vertexColors: true
    });

    const puntosMesh = new THREE.Points(geometry, material);
    scene.add(puntosMesh);

    /********************
     * ⚡ INTERACCIÓN Y ANIMACIÓN
     ********************/
    let intensidadLuz = 2;
    let velocidadLatido = 1;
    let clics = 0;

    function animar() {
      requestAnimationFrame(animar);
      const factor = Math.sin(Date.now() * 0.005 * velocidadLatido) * 0.15 + 1;
      puntosMesh.scale.set(factor, factor, factor);
      renderer.render(scene, camera);
    }
    animar();

    document.addEventListener('click', () => {
      clics++;
      intensidadLuz += 1.5;
      light.intensity = intensidadLuz;
      ambientLight.intensity = Math.min(0.8, intensidadLuz * 0.1);

      velocidadLatido += 0.7;

      // Pulsación rápida del glow rosa
      const originalIntensity = light.intensity;
      let up = true;
      const pulseTime = 300;

      const pulse = () => {
        if (up) {
          light.intensity = originalIntensity + 2;
          up = false;
          setTimeout(pulse, pulseTime / 2);
        } else {
          light.intensity = originalIntensity;
          up = true;
          setTimeout(pulse, pulseTime / 2);
        }
      };
      pulse();

      if (clics >= 5) {
        document.getElementById('mensaje').style.opacity = 1;
      }
    });

    window.addEventListener('resize', () => {
      letrasCanvas.width = window.innerWidth;
      letrasCanvas.height = window.innerHeight;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
